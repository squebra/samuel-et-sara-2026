<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex,nofollow"/>
<title>Samuel &amp; Sara — Photos</title>
<link href="https://fonts.googleapis.com/css2?family=Carattere&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=EB+Garamond:ital@0;1&family=Great+Vibes&family=Montserrat:wght@300;400&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  input, textarea, select { outline: none !important; box-shadow: none !important; -webkit-appearance: none; -moz-appearance: none; appearance: none; }
  input:required, textarea:required { box-shadow: none !important; outline: none !important; }
  body {
    font-family: 'Montserrat', sans-serif;
    background: #f9f6f0;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* HERO */
  .hero {
    min-height: 100vh;
    background: #1a1410;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 3rem 2rem;
    position: relative;
  }
  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 60% 40% at 50% 0%, rgba(200,169,126,0.10) 0%, transparent 70%);
    pointer-events: none;
  }
  .hero-label {
    font-size: 13.0px; letter-spacing: 0.35em; text-transform: uppercase;
    color: #c8a97e; margin-bottom: 1.5rem;
  }
  .hero-monogram { margin-bottom: 1rem; }
  .hero-monogram svg { width: 100px; height: auto; }
  .hero-monogram svg g { fill: #b8942a; }
  .hero-names {
    font-family: 'Carattere', cursive;
    font-size: clamp(38px, 7vw, 58px);
    font-weight: 400;
    color: #f7f3ec;
    line-height: 1.1;
    word-spacing: 0.4em;
    margin-bottom: 0.4em;
  }

  .gold-line { width: 80px; height: 1px; background: linear-gradient(90deg, transparent, #c8a97e, transparent); margin: 1.5rem auto; }
  .hero-date { font-size: 13.0px; letter-spacing: 0.25em; text-transform: uppercase; color: #c8a97e; margin-bottom: 0.4rem; }
  .hero-lieu { font-family: 'Cormorant Garamond', serif; font-size: 20.0px; font-style: italic; color: #f7f3ec; opacity: 0.75; }
  .scroll-hint { position: absolute; bottom: 2rem; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .scroll-hint span { font-size: 12.0px; letter-spacing: 0.3em; text-transform: uppercase; color: #c8a97e; opacity: 0.7; }
  .scroll-arrow { width: 1px; height: 36px; background: linear-gradient(to bottom, #c8a97e, transparent); }

  /* FORM SECTION */
  .form-section { background: #f7f3ec; padding: 5rem 2rem 6rem; position: relative; }
  .form-section::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, transparent, #c8a97e, transparent); }
  .section-header { text-align: center; margin-bottom: 3rem; }
  .section-label { font-size: 12.0px; letter-spacing: 0.4em; text-transform: uppercase; color: #9a7a50; margin-bottom: 0.8rem; }
  .section-title { font-family: 'Cormorant Garamond', serif; font-size: 37.0px; font-style: italic; font-weight: 300; color: #1a1410; margin-bottom: 0.8rem; }
  .section-sub { font-size: 15.0px; font-weight: 300; color: #7a6a54; line-height: 1.9; }

  /* FORM CARD */
  .form-card {
    background: #fff; border: 1px solid #e8d5b0; border-radius: 2px;
    max-width: 560px; margin: 0 auto; padding: 3rem 2.5rem; position: relative;
  }
  .form-card::before, .form-card::after { content: ''; position: absolute; width: 18px; height: 18px; border-color: #c8a97e; border-style: solid; }
  .form-card::before { top: 10px; left: 10px; border-width: 1px 0 0 1px; }
  .form-card::after  { bottom: 10px; right: 10px; border-width: 0 1px 1px 0; }

  .field-group { margin-bottom: 1.8rem; }
  .field-label { display: block; font-size: 12.0px; letter-spacing: 0.3em; text-transform: uppercase; color: #9a7a50; margin-bottom: 0.5rem; }
  .field-input { width: 100%; border: none; border-bottom: 1px solid #e0d8cc; padding: 10px 0; font-family: 'Montserrat', sans-serif; font-size: 17.0px; font-weight: 300; color: #1a1410; background: transparent; outline: none; box-shadow: none; -webkit-appearance: none; transition: border-color 0.3s; }
  .field-input:focus { border-bottom-color: #c8a97e; }
  .field-input::placeholder { color: #ccc; }

  .presence-toggle { display: flex; gap: 1rem; margin-top: 0.4rem; }
  .toggle-opt { flex: 1; position: relative; }
  .toggle-opt input[type="radio"] { position: absolute; opacity: 0; width: 0; height: 0; }
  .toggle-opt label { display: block; text-align: center; padding: 12px; border: 1px solid #e0d8cc; font-size: 14.0px; letter-spacing: 0.15em; text-transform: uppercase; color: #7a6a54; cursor: pointer; transition: all 0.25s; user-select: none; }
  .toggle-opt input:checked + label { background: #1a1410; border-color: #1a1410; color: #c8a97e; }
  .toggle-opt label:hover { border-color: #c8a97e; color: #9a7a50; }

  .check-grid { display: flex; flex-direction: row; flex-wrap: wrap; gap: 8px; margin-top: 0.4rem; }
  .check-item { position: relative; }
  .check-item input[type="checkbox"], .check-item input[type="radio"] { position: absolute; opacity: 0; width: 0; height: 0; }
  .check-item label { display: flex; align-items: center; gap: 8px; font-size: 14.0px; font-weight: 300; color: #7a6a54; cursor: pointer; padding: 7px 10px; border: 1px solid #e0d8cc; transition: all 0.2s; line-height: 1.4; }
  .check-item label::before { content: ''; width: 13px; height: 13px; min-width: 13px; border: 1px solid #e0d8cc; background: transparent; transition: all 0.2s; }
  .check-item input:checked + label { border-color: #c8a97e; color: #1a1410; background: #fdf9f3; }
  .check-item input:checked + label::before { background: #c8a97e; border-color: #c8a97e; }

  .autre-input { margin-top: 0.7rem; width: 100%; border: none; border-bottom: 1px solid #e0d8cc; padding: 8px 0; font-family: 'Montserrat', sans-serif; font-size: 16.0px; font-weight: 300; color: #1a1410; background: transparent; outline: none; transition: border-color 0.3s; display: none; }
  .autre-input.visible { display: block; }
  .autre-input:focus { border-bottom-color: #c8a97e; }

  .field-textarea { width: 100%; border: 1px solid #e0d8cc; padding: 12px; font-family: 'Cormorant Garamond', serif; font-size: 18.0px; font-style: italic; font-weight: 300; color: #1a1410; background: #fdf9f3; outline: none; resize: vertical; min-height: 90px; transition: border-color 0.3s; margin-top: 0.4rem; }
  .field-textarea:focus { border-color: #c8a97e; }
  .field-textarea::placeholder { color: #ccc; }

  .form-divider { height: 1px; background: linear-gradient(90deg, transparent, #e8d5b0, transparent); margin: 1.8rem 0; }

  .submit-btn { width: 100%; background: #1a1410; color: #c8a97e; border: none; padding: 16px; font-family: 'Montserrat', sans-serif; font-size: 13.0px; font-weight: 400; letter-spacing: 0.35em; text-transform: uppercase; cursor: pointer; transition: background 0.3s; }
  .submit-btn:hover { background: #2d2218; }

  /* SUCCESS */
  .success-msg { display: none; text-align: center; padding: 3rem 2rem; }
  .success-msg.visible { display: block; }
  .success-icon { width: 58px; height: 58px; border: 1px solid #c8a97e; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; }
  .success-icon svg { width: 28px; height: auto; }
  .success-icon svg g { fill: #b8942a; }
  .success-title { font-family: 'Cormorant Garamond', serif; font-size: 31.0px; font-style: italic; font-weight: 300; color: #1a1410; margin-bottom: 0.7rem; }
  .success-text { font-size: 15.0px; font-weight: 300; color: #7a6a54; line-height: 1.9; }

  /* FOOTER */
  .footer { background: #1a1410; text-align: center; padding: 2.5rem; }
  .footer-monogram { margin-bottom: 0.8rem; }
  .footer-monogram svg { width: 44px; height: auto; opacity: 0.8; }
  .footer-monogram svg g { fill: #b8942a; }
  .footer-names { font-family: 'Carattere', cursive; font-size: 29.0px; word-spacing: 0.3em; color: #c8a97e; margin-bottom: 0.4rem; }
  .footer-note { font-size: 12.0px; letter-spacing: 0.2em; color: #6a5a48; text-transform: uppercase; }

  /* ══════════════════════════════
     RESPONSIVE MOBILE
  ══════════════════════════════ */
  @media (max-width: 768px) {

    /* Hero */
    .hero {
      padding: 2.5rem 1.25rem 3rem;
      min-height: 100svh;
    }
    .hero-label { font-size: 10px; letter-spacing: 0.2em; }
    .hero-monogram svg { width: 70px; }
    .hero-names { font-size: 38px !important; word-spacing: 0.15em; }
    .hero-date { font-size: 10px; }
    .hero-lieu { font-size: 14px; }
    .gold-line { margin: 1rem auto; }

    /* Form section */
    .form-section { padding: 2.5rem 0 3rem; }
    .section-title { font-size: 24px !important; }
    .section-sub { font-size: 13px; padding: 0 1rem; }

    /* Form card — pleine largeur */
    .form-card {
      padding: 2.5rem 1.25rem 2.5rem;
      margin: 0;
      border-radius: 0;
      border-left: none;
      border-right: none;
    }
    .form-card::before { top: 8px; left: 8px; width: 14px; height: 14px; }
    .form-card::after  { bottom: 8px; right: 8px; width: 14px; height: 14px; }

    /* Labels */
    .field-label { font-size: 10px; letter-spacing: 0.2em; }

    /* Inputs - 16px minimum pour éviter zoom iOS */
    .field-input {
      font-size: 16px !important;
      padding: 12px 0;
    }
    .field-textarea { font-size: 16px !important; min-height: 100px; }
    .autre-input { font-size: 16px !important; }

    /* Présence — une option par ligne */
    .presence-toggle { flex-direction: column; gap: 8px; }
    .toggle-opt label {
      padding: 15px;
      font-size: 16px;
      text-align: center;
    }

    /* Régime — une option par ligne */
    .check-grid {
      display: flex !important;
      flex-direction: column !important;
      gap: 8px;
    }
    .check-item { width: 100%; }
    .check-item label {
      font-size: 15px;
      padding: 12px 14px;
    }

    /* Bouton */
    .submit-btn { padding: 18px; font-size: 12px; }

    /* Success */
    .success-title { font-size: 26px !important; }
    .success-text  { font-size: 14px; }

    /* Footer */
    .footer { padding: 2rem 1rem; }
    .footer-names { font-size: 28px !important; }
    .footer-note  { font-size: 11px; }
  }

  @media (max-width: 400px) {
    .hero-names { font-size: 32px !important; }
    .hero-monogram svg { width: 55px; }
    .form-card { padding: 1.75rem 1rem 2rem; }
    .toggle-opt label { font-size: 15px; }
    .check-item label { font-size: 14px; }
  }


  /* ── HERO BORDER (same as invitation card) ── */
  .hero-border-outer {
    position: absolute;
    inset: 18px;
    border: 0.75px solid #c8a97e;
    pointer-events: none;
    z-index: 5;
  }
  .hero-border-inner {
    position: absolute;
    inset: 24px;
    border: 0.3px solid rgba(200,169,126,0.3);
    pointer-events: none;
    z-index: 5;
  }
  .hero-corner {
    position: absolute;
    width: 26px;
    height: 26px;
    z-index: 6;
    pointer-events: none;
  }
  .hero-corner.tl { top: 12px; left: 12px; }
  .hero-corner.tr { top: 12px; right: 12px; transform: scaleX(-1); }
  .hero-corner.bl { bottom: 12px; left: 12px; transform: scaleY(-1); }
  .hero-corner.br { bottom: 12px; right: 12px; transform: scale(-1); }

  @media (max-width: 768px) {
    .hero-border-outer { inset: 12px; }
    .hero-border-inner { inset: 17px; }
    .hero-corner { width: 18px; height: 18px; }
    .hero-corner.tl { top: 8px; left: 8px; }
    .hero-corner.tr { top: 8px; right: 8px; }
    .hero-corner.bl { bottom: 8px; left: 8px; }
    .hero-corner.br { bottom: 8px; right: 8px; }
  }

  /* ── ANIMATIONS HERO ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(28px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes scrollPulse {
    0%, 100% { opacity: 0.4; transform: scaleY(1); }
    50%       { opacity: 1;   transform: scaleY(1.2); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  .hero-label    { animation: fadeUp 0.9s 0.1s ease both; }
  .hero-monogram { animation: fadeUp 0.9s 0.25s ease both; }
  .hero-names    { animation: fadeUp 0.9s 0.4s ease both; }
  .gold-line     { animation: fadeUp 0.9s 0.55s ease both; }
  .hero-date     { animation: fadeUp 0.9s 0.65s ease both; }
  .hero-lieu     { animation: fadeUp 0.9s 0.75s ease both; }
  .scroll-hint   { animation: fadeUp 0.9s 1.1s ease both; }
  .scroll-arrow  { animation: scrollPulse 2s ease-in-out infinite; }

  /* Border fade in */
  .hero-border-outer { animation: fadeIn 1.2s 0.3s ease both; }
  .hero-border-inner { animation: fadeIn 1.2s 0.5s ease both; }
  .hero-corner       { animation: fadeIn 1.2s 0.5s ease both; }


  html { scroll-behavior: smooth; }
  .memo-label { font-family: 'EB Garamond', serif; font-size: 14px; letter-spacing: .3em; text-transform: uppercase; color: #b8942a; }
  .memo-rule { display: flex; align-items: center; gap: 8px; max-width: 370px; margin: 12px auto 0; }
  .memo-rule::before, .memo-rule::after { content: ''; flex: 1; height: .5px; background: linear-gradient(90deg, transparent, #c8a97e); }
  .memo-rule::after { transform: scaleX(-1); }
  .memo-rule i { width: 4px; height: 4px; background: #c8a97e; transform: rotate(45deg); }
  .memo-title { font-family: 'Great Vibes', cursive; font-weight: 400; font-size: 44px; color: #1a1410; line-height: 1.2; margin-top: 14px; }
  .memo-text { font-family: 'EB Garamond', serif; font-style: italic; font-size: 17px; color: #5a4f40; line-height: 1.8; max-width: 540px; margin: 8px auto 0; }
  @media (max-width: 768px) { .memo-title { font-size: 38px; } .memo-text { font-size: 16px; padding: 0 1.25rem; } }
  a.scroll-hint { text-decoration: none; }
  .form-card.album-card { max-width: 880px; }
  .album-card .sub-label { font-size: 12px; letter-spacing: .4em; text-transform: uppercase; color: #9a7a50; text-align: center; margin: 2.2rem 0 1rem; font-weight: 400; }
  .album-card .sub-label:first-of-type { margin-top: 0; }
  .album-card .lead { text-align: center; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 19px; line-height: 1.6; color: #5a4f40; max-width: 460px; margin: 0 auto; }
  .btn { display: inline-block; background: #1a1410; color: #c8a97e; border: none; padding: 15px 26px; font-family: 'Montserrat', sans-serif; font-size: 12px; font-weight: 400; letter-spacing: .3em; text-transform: uppercase; cursor: pointer; text-decoration: none; transition: background .3s; }
  .btn:hover { background: #2d2218; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.ghost { background: transparent; color: #1a1410; border: 1px solid #c8a97e; padding: 8px 14px; font-size: 11px; letter-spacing: .2em; }
  .btn.ghost:hover { background: #fdf9f3; }
  #login { text-align: center; }
  #loginForm { max-width: 320px; margin: 1.6rem auto 0; display: flex; flex-direction: column; gap: 12px; }
  #pw { font-family: 'Montserrat', sans-serif; font-size: 16px; font-weight: 300; text-align: center; padding: 12px; border: 1px solid #e0d8cc; background: #fdf9f3; color: #1a1410; border-radius: 0; }
  #pw:focus { border-color: #c8a97e; }
  .err { color: #9b2d20; font-style: italic; min-height: 1.4em; font-size: 14px; }
  #drop { border: 1px dashed #c8a97e; padding: 24px 14px; text-align: center; background: #fdf9f3; transition: background .15s; }
  #drop.over { background: #f5ecdc; }
  #drop small { display: block; color: #7a6a54; font-weight: 300; margin-top: 12px; font-size: 13px; }
  #queue { list-style: none; margin-top: 14px; }
  #queue li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: .5px solid rgba(200,169,126,.35); font-size: 13px; font-weight: 300; }
  #queue .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #queue .bar { width: 84px; height: 3px; background: #eee5d4; position: relative; flex-shrink: 0; }
  #queue .bar b { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #b8942a; }
  #queue .st { width: 76px; text-align: right; font-size: 11px; color: #7a6a54; flex-shrink: 0; }
  #queue li.ok .st { color: #4a7a4a; } #queue li.ko .st { color: #9b2d20; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #7a6a54; font-weight: 300; margin-bottom: 10px; }
  .tabs { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-bottom: 18px; }
  .tab { background: transparent; color: #7a6a54; border: 1px solid #e0d8cc; padding: 10px 14px; font-family: 'Montserrat', sans-serif; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; cursor: pointer; transition: all .2s; }
  .tab:hover { border-color: #c8a97e; color: #9a7a50; }
  .tab.on { background: #1a1410; border-color: #1a1410; color: #c8a97e; }
  #grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  @media (min-width: 560px) { #grid { grid-template-columns: repeat(4, 1fr); gap: 6px; } }
  @media (min-width: 800px) { #grid { grid-template-columns: repeat(5, 1fr); } }
  .tile { position: relative; aspect-ratio: 1; background: #efe7d6; overflow: hidden; cursor: pointer; border: none; padding: 0; display: block; }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #7a6a54; font-size: 11px; padding: 6px; text-align: center; word-break: break-all; }
  .tile .vid { position: absolute; right: 5px; bottom: 5px; background: rgba(26,20,16,.75); color: #fff; font-size: 10px; padding: 2px 6px; letter-spacing: .1em; }
  #empty { text-align: center; color: #7a6a54; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 18px; padding: 26px 0; }
  #more { margin: 18px auto 0; display: block; }
  .hidden { display: none !important; }
  #lb { position: fixed; inset: 0; background: rgba(15,11,8,.96); z-index: 50; display: flex; flex-direction: column; }
  #lb .top { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; color: #e9dfcc; font-size: 13px; gap: 10px; }
  #lb .top .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: .8; }
  #lb .top a, #lb .top button { color: #c8a97e; background: none; border: 1px solid #c8a97e; padding: 8px 14px; font-family: 'Montserrat', sans-serif; letter-spacing: .18em; text-transform: uppercase; font-size: 11px; text-decoration: none; cursor: pointer; }
  #lb .stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; }
  #lb .stage img, #lb .stage video { max-width: 100%; max-height: 100%; object-fit: contain; }
  #lb .nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(26,20,16,.55); color: #fff; border: none; width: 44px; height: 64px; font-size: 26px; cursor: pointer; }
  #lb .prev { left: 0; } #lb .next { right: 0; }
  #lb .msg { color: #e9dfcc; text-align: center; padding: 20px; font-style: italic; }
</style>
</head>
<body>

<section class="hero">
  <div class="hero-border-outer"></div>
  <div class="hero-border-inner"></div>
  <svg class="hero-corner tl" viewBox="0 0 26 26" fill="none"><path d="M2 2 L2 18 M2 2 L18 2" stroke="#c8a97e" stroke-width="0.8"/><circle cx="2" cy="2" r="1.4" fill="#c8a97e"/></svg>
  <svg class="hero-corner tr" viewBox="0 0 26 26" fill="none"><path d="M2 2 L2 18 M2 2 L18 2" stroke="#c8a97e" stroke-width="0.8"/><circle cx="2" cy="2" r="1.4" fill="#c8a97e"/></svg>
  <svg class="hero-corner bl" viewBox="0 0 26 26" fill="none"><path d="M2 2 L2 18 M2 2 L18 2" stroke="#c8a97e" stroke-width="0.8"/><circle cx="2" cy="2" r="1.4" fill="#c8a97e"/></svg>
  <svg class="hero-corner br" viewBox="0 0 26 26" fill="none"><path d="M2 2 L2 18 M2 2 L18 2" stroke="#c8a97e" stroke-width="0.8"/><circle cx="2" cy="2" r="1.4" fill="#c8a97e"/></svg>
  <p class="hero-label">Album — 27 Août 2026</p>
  <div class="hero-monogram">

      v.onseeked = function () { toJpeg(v, v.videoWidth, v.videoHeight).then(function (b) { fin(res, b); }, function (e) { fin(rej, e); }); };
      v.onerror = function () { fin(rej, new Error('video')); };
      setTimeout(function () { fin(rej, new Error('timeout')); }, 8000);
      v.src = u;
    });
  }

  function run(job) {
    var id = newId(), f = job.file;
    job.st.textContent = T.sending;
    var thumbP = makeThumb(f, job.type).catch(function () { return null; });
    return xhrPut(API + '/api/upload?id=' + id + '&kind=orig', f, job.type, f.name, function (p) {
      job.bar.style.width = Math.round(p * 100) + '%'; job.st.textContent = Math.round(p * 100) + ' %';
    }).then(function () { return thumbP; })
      .then(function (tb) {
        var up = tb ? xhrPut(API + '/api/upload?id=' + id + '&kind=thumb', tb, 'image/jpeg').catch(function () {}) : Promise.resolve();
        return up.then(function () { return tb; });
      })
      .then(function (tb) {
        job.li.className = 'ok'; job.st.textContent = T.done; job.bar.style.width = '100%';
        if (album !== 'invites') return;
        var it = { id: id, key: 'orig/' + id + '/' + safeName(f.name), name: f.name, size: f.size, type: job.type };
        items.unshift(it);
        var el = tile(it, tb ? URL.createObjectURL(tb) : null);
        $('grid').insertBefore(el, $('grid').firstChild);
        refreshMeta();
      })
      .catch(function () { job.li.className = 'ko'; job.st.textContent = T.failed; });
  }

  /* ---------- Visionneuse ---------- */
  var cur = -1;
  function realKey(it) { return it.key; }
  function openLb(i) {
    if (i < 0 || i >= items.length) return;
    cur = i; var it = items[i];
    $('lb').classList.remove('hidden'); document.body.style.overflow = 'hidden';
    $('lbName').textContent = it.name;
    var orig = fileUrl(realKey(it));
    // Photos du photographe : version allégée à l'écran, original au téléchargement
    var src = it.view && !isVideo(it) ? fileUrl('view/' + it.id + '.jpg') : orig;
    var st = $('lbStage');
    var old = st.querySelector('img,video,.msg'); while (old) { old.remove(); old = st.querySelector('img,video,.msg'); }
    var el;
    if (isVideo(it)) { el = document.createElement('video'); el.controls = true; el.playsInline = true; el.autoplay = true; el.src = src; }
    else { el = document.createElement('img'); el.alt = it.name; el.src = src; }
    el.onerror = function () {
      if (src !== orig) { src = orig; el.src = orig; return; }
      el.remove(); var m = document.createElement('p'); m.className = 'msg'; m.textContent = T.noPreview; st.appendChild(m);
    };
    st.insertBefore(el, st.firstChild);
    $('lbDl').href = fileUrl(realKey(it), true);
    $('lbPrev').classList.toggle('hidden', i === 0);
    $('lbNext').classList.toggle('hidden', i === items.length - 1 && !truncated);
  }
  function closeLb() {
    $('lb').classList.add('hidden'); document.body.style.overflow = '';
    var v = $('lbStage').querySelector('video'); if (v) v.pause();
    var m = $('lbStage').querySelector('img,video,.msg'); while (m) { m.remove(); m = $('lbStage').querySelector('img,video,.msg'); }
  }
  function step(d) {
    if (cur + d >= items.length && truncated) { loadMore().then(function () { openLb(cur + d); }); return; }
    openLb(cur + d);
  }
  $('lbClose').addEventListener('click', closeLb);
  $('lbPrev').addEventListener('click', function () { step(-1); });
  $('lbNext').addEventListener('click', function () { step(1); });
  document.addEventListener('keydown', function (e) {
    if ($('lb').classList.contains('hidden')) return;
    if (e.key === 'Escape') closeLb(); else if (e.key === 'ArrowLeft') step(-1); else if (e.key === 'ArrowRight') step(1);
  });
  var sx = null;
  $('lbStage').addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; }, { passive: true });
  $('lbStage').addEventListener('touchend', function (e) {
    if (sx === null) return; var dx = e.changedTouches[0].clientX - sx; sx = null;
    if (Math.abs(dx) > 60) step(dx < 0 ? 1 : -1);
  });

  /* ---------- Démarrage ---------- */
  if (token) enter(); else show(false);
})();
</script>
</body>
</html>
